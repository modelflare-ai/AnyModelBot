<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第 6 步 · 生成一张图 · 新手引导预览</title>
<style>
body{margin:0;background:#060706}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit}
a{color:#d7ff00}a:hover{color:#e9ff66}
</style>
<link rel="stylesheet" href="css/bots.css">
<link rel="stylesheet" href="css/proto.css">
</head>
<body data-page="media">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #060706; color: #fafaf7; font-family: Geist, 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; font-size: 14px; line-height: 1.5">

  <aside aria-label="机器人" style="flex: 1 1 248px; max-width: 100%; display: flex; flex-direction: column; gap: 6px; padding: 14px 12px 12px; background: #0a0b0a; border-right: 1px solid rgba(255,255,255,.10)">
    <div aria-hidden="true" style="display: flex; gap: 8px; padding: 4px 6px 14px">
      <span style="width: 11px; height: 11px; border-radius: 50%; background: rgba(127,127,127,.45)"></span>
      <span style="width: 11px; height: 11px; border-radius: 50%; background: rgba(127,127,127,.45)"></span>
      <span style="width: 11px; height: 11px; border-radius: 50%; background: rgba(127,127,127,.45)"></span>
    </div>
    <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 10px; color: #a1a1aa; font-size: 13.5px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      新建机器人
    </button>
    <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: .08em; color: #a1a1aa; padding: 10px 10px 4px">机器人</div>
    <a href="Main.html" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px; border-radius: 12px; background: rgba(255,255,255,.06); color: #fafaf7; text-decoration: none">
      <span class="face" data-char="blue" style="width: 34px; height: 34px; flex: none"></span>
      <span style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-weight: 600; font-size: 14px">天天</span>
        <span style="color: #a1a1aa; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">等你确认：生成图片</span>
      </span>
    </a>
    <div style="flex: 1"></div>
    <a href="Main.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 12px; background: rgba(215,255,0,.10); box-shadow: inset 0 0 0 1px rgba(215,255,0,.30); color: #fafaf7; font-size: 13.5px; text-decoration: none">
      <span style="display: flex; gap: 3px" aria-hidden="true">
        <span style="width: 5px; height: 14px; border-radius: 2px; background: #d7ff00"></span>
        <span style="width: 5px; height: 14px; border-radius: 2px; background: #d7ff00"></span>
        <span style="width: 5px; height: 14px; border-radius: 2px; background: #d7ff00"></span>
        <span style="width: 5px; height: 14px; border-radius: 2px; background: #d7ff00"></span>
        <span style="width: 5px; height: 14px; border-radius: 2px; background: #d7ff00"></span>
        <span style="width: 5px; height: 14px; border-radius: 2px; background: rgba(255,255,255,.16)"></span>
      </span>
      <span style="flex: 1; font-weight: 500">上手清单</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #d7ff00">5 / 6</span>
    </a>
    <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 10px; border-radius: 12px; text-align: left">
      <span aria-hidden="true" style="display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #d7ff00; color: #161a00; font-weight: 700; font-size: 13px">Z</span>
      <span style="flex: 1; font-size: 13.5px">我的账户</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; color: #a1a1aa">$12.35</span>
    </button>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; min-height: 100vh">
    <header style="display: flex; align-items: center; gap: 8px; height: 54px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.10)">
      <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 6px; border-radius: 999px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); font-weight: 600; font-size: 14px">
        <span class="face" data-char="blue" style="width: 24px; height: 24px"></span>
        天天
      </button>
      <span style="flex: 1"></span>
      <button type="button" aria-label="开始新的一段对话" style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: #a1a1aa">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button type="button" aria-label="信息面板" style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: #a1a1aa">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg>
      </button>
    </header>

    <div style="flex: 1; overflow: auto">
      <div style="max-width: 980px; margin: 0 auto; padding: 32px 24px 24px; display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: flex-start">

        <div id="log" style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
          <div id="status" hidden style="display: flex; flex-direction: column; gap: 6px">
            <span style="display: inline-flex; align-items: center; gap: 8px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; color: #a1a1aa"><span id="status-dot" aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #f2b544"></span><span id="status-text">等你确认</span>
            </span>
          </div>

          <!-- 生成前的确认卡片（与审批 / 提问卡片同一套样式） -->
          <form id="confirm" hidden style="max-width: 520px; padding: 18px; border-radius: 20px; background: #0b0b10; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10)">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px">
              <span style="display: inline-flex; align-items: center; gap: 8px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; letter-spacing: .06em; color: #a1a1aa">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
                生成图片
              </span>
              <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; color: #a1a1aa">10 分钟内有效</span>
            </div>
            <p style="margin: 0 0 8px; font-size: 16px; font-weight: 600">这次用 <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500">[默认图片模型]</span> 生成图片吗？</p>
            <p style="margin: 0 0 14px; color: #a1a1aa; font-size: 13px; line-height: 1.7; white-space: pre-line">提示词：戴着耳机的蓝色小机器人，扁平插画风
尺寸 1024×1024 · 1 张
也可以直接回复其他模型名。</p>
            <fieldset style="margin: 0 0 12px; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
              <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">选择模型</legend>
              <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border-radius: 14px; background: rgba(215,255,0,.10); box-shadow: inset 0 0 0 1px rgba(215,255,0,.45); cursor: pointer">
                <input type="radio" name="m" checked style="accent-color: #d7ff00; width: 16px; height: 16px; margin: 0">
                <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #d7ff00">A</span>
                <span style="flex: 1; min-width: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px">[默认图片模型]</span>
                <span style="color: #a1a1aa; font-size: 12.5px">默认 · 约 $[0.04] / 张</span>
              </label>
              <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); cursor: pointer">
                <input type="radio" name="m" style="accent-color: #d7ff00; width: 16px; height: 16px; margin: 0">
                <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #a1a1aa">B</span>
                <span style="flex: 1; min-width: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px">[图片模型 2]</span>
                <span style="color: #a1a1aa; font-size: 12.5px">约 $[0.02] / 张</span>
              </label>
              <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); cursor: pointer">
                <input type="radio" name="m" style="accent-color: #d7ff00; width: 16px; height: 16px; margin: 0">
                <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #a1a1aa">C</span>
                <span style="flex: 1; min-width: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px">[图片模型 3]</span>
                <span style="color: #a1a1aa; font-size: 12.5px">约 $[0.08] / 张</span>
              </label>
              <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); cursor: pointer">
                <input type="radio" name="m" style="accent-color: #d7ff00; width: 16px; height: 16px; margin: 0">
                <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #a1a1aa">D</span>
                <span style="flex: 1; min-width: 0; font-size: 13.5px">取消</span>
                <span style="color: #a1a1aa; font-size: 12.5px">这次不生成</span>
              </label>
            </fieldset>
            <label style="display: block; margin-bottom: 14px">
              <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">其他回答</span>
              <input type="text" placeholder="或者输入其他回答" style="width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: 12px; background: #101110; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); color: #fafaf7; font-size: 13.5px; outline: none">
            </label>
            <div style="display: flex; align-items: center; gap: 10px">
              <button type="button" style="min-height: 40px; padding: 0 20px; border-radius: 999px; background: #d7ff00; color: #161a00; font-weight: 600; font-size: 14px" id="go">确认生成</button>
              <span style="color: #a1a1aa; font-size: 12.5px">确认后才会扣费</span>
            </div>
          </form>
          <div id="result" hidden></div>
        </div>

        <!-- 引导卡片：指向左边的确认卡片 -->
        <section id="coach" hidden aria-label="上手引导" style="position: relative; flex: 1 1 300px; max-width: 340px; margin-top: 120px; padding: 20px 20px 16px; border-radius: 20px; background: #0b0b10; box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 30px 80px -20px rgba(0,0,0,.75)">
          <span class="face" data-char="blue" style="position: absolute; right: 18px; top: -40px; width: 52px; height: 52px"></span>
          <span id="arrow" aria-hidden="true" style="position: absolute; left: -7px; top: 44px; width: 14px; height: 14px; transform: rotate(45deg); background: #0b0b10; box-shadow: -1px 1px 0 rgba(255,255,255,.18)"></span>
          <p id="c-kick" style="display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 12.5px; letter-spacing: .06em; color: #a1a1aa">
            <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #d7ff00">06 / 06</span>上手清单
          </p>
          <h2 id="c-title" style="margin: 0 0 6px; font-size: 19px; font-weight: 600; letter-spacing: -.01em">生成一张图</h2>
          <p id="c-body" style="margin: 0 0 12px; color: #a1a1aa; line-height: 1.7">天天可以画图、做视频。每次生成前，都会先问你用哪个模型，并给出参考价。</p>
          <ul id="c-list" style="list-style: none; margin: 0 0 14px; padding: 12px 0 0; border-top: 1px solid rgba(255,255,255,.10); display: flex; flex-direction: column; gap: 9px; font-size: 13px; color: #a1a1aa">
            <li style="display: flex; gap: 10px"><span aria-hidden="true" style="flex: none; width: 10px; height: 6px; margin-top: 6px; border-left: 2px solid #d7ff00; border-bottom: 2px solid #d7ff00; transform: rotate(-45deg)"></span>你点「确认生成」才会生成，才会花钱</li>
            <li style="display: flex; gap: 10px"><span aria-hidden="true" style="flex: none; width: 10px; height: 6px; margin-top: 6px; border-left: 2px solid #d7ff00; border-bottom: 2px solid #d7ff00; transform: rotate(-45deg)"></span>可以换个模型，或者直接取消</li>
            <li style="display: flex; gap: 10px"><span aria-hidden="true" style="flex: none; width: 10px; height: 6px; margin-top: 6px; border-left: 2px solid #d7ff00; border-bottom: 2px solid #d7ff00; transform: rotate(-45deg)"></span>10 分钟内没回答，就不生成</li>
          </ul>
          <p id="c-note" style="margin: 0 0 16px; color: #a1a1aa; font-size: 12.5px">默认的图片、视频模型，在「设置 → Modelflare」里改。</p>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <button type="button" id="c-later" style="min-height: 36px; padding: 0 4px; color: #a1a1aa; font-size: 13.5px">稍后再说</button>
            <a id="c-next" href="Main.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 16px; border-radius: 999px; background: #d7ff00; color: #161a00; font-weight: 600; font-size: 14px; text-decoration: none">完成清单</a>
          </div>
        </section>
      </div>
    </div>

    <div style="padding: 0 24px 24px">
      <div style="max-width: 760px; margin: 0 auto; border-radius: 18px; background: #101110; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10)">
        <textarea id="input" class="input" rows="1" aria-label="消息" placeholder="给「天天」发消息，/ 查看命令"></textarea>
        <div style="display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px">
          <button type="button" aria-label="更多操作" style="display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: #a1a1aa">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; color: #a1a1aa; font-size: 12.5px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>
            工作区可写
          </button>
          <span style="flex: 1"></span>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; color: #a1a1aa; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px">gpt-6.1-terra</button>
          <button type="button" id="send" aria-label="发送" style="display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: #161a00; color: #d7ff00; opacity: .5">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="js/page-media.js"></script>
</body>
</html>
