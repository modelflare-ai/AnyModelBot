<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AnyModelBot</title>
  <link rel="icon" href="/amb/static/assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/amb/static/assets/favicon-64.png" sizes="64x64" type="image/png" />
  <link rel="apple-touch-icon" href="/amb/static/assets/apple-touch-icon.png" />
  <script>
    // 首帧前解析主题（data-theme 总是 light/dark，CSS 只定义一份深色变量）与平台
    (function () {
      var root = document.documentElement;
      var m = "system";
      try { m = localStorage.getItem("amb-theme") || "system"; } catch (_) {}
      var dark = m === "dark" || (m !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      root.setAttribute("data-theme", dark ? "dark" : "light");
      if (/Windows/.test(navigator.userAgent)) root.classList.add("win");
      if (/Electron/.test(navigator.userAgent) && /Mac/.test(navigator.platform)) root.classList.add("mac-app");
    })();
  </script>
  <!-- 设计库（token / 基础 / 组件 / 工具类，见 ui/design/README.md）+ 页面样式（@layer app） -->
  <link rel="stylesheet" href="/amb/static/design/index.css" />
  <link rel="stylesheet" href="/amb/static/css/shell.css" />
  <link rel="stylesheet" href="/amb/static/css/chat.css" />
  <link rel="stylesheet" href="/amb/static/css/settings.css" />
  <script type="importmap">
    { "imports": { "preact": "/amb/vendor/preact.mjs", "preact/hooks": "/amb/vendor/hooks.mjs", "htm": "/amb/vendor/htm.mjs" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/amb/static/main.js"></script>
</body>
</html>
