# Release: one single-file installer per platform/arch.
#
# How to use
#   - Release: bump "version" in package.json, commit, then push a tag `v<version>` (e.g. v0.1.4).
#     The tag must equal "v" + package.json version or the run fails before building anything.
#     All installers are built; then the GitHub Release for that tag is created (or, if it
#     already exists, its assets are replaced) with the installers plus SHA256SUMS.
#     Tags containing "-" (v0.2.0-rc.1) are published as pre-releases.
#   - Test build: Actions -> Release -> "Run workflow" on any branch. Same builds; the installers are
#     only kept as workflow artifacts (14 days). Running it on a tag ref re-publishes that release.
#   - Fewer installers: "Run workflow" takes `targets`, a comma-separated list of the names below
#     (e.g. `mac-arm64`); the default `all` builds every one. A tag push always builds all of them.
#     To release a tag with only some installers, cancel the run the tag push started and run the
#     workflow on that tag with `targets`.
#
# Outputs (<version> = package.json version)
#   anymodel-bot-<version>-mac-arm64.dmg            macos-15 (Apple Silicon)
#   anymodel-bot-<version>-mac-x64.dmg              macos-15-intel
#   anymodel-bot-<version>-win-x64.exe              windows-2025    (NSIS)
#   anymodel-bot-<version>-win-arm64.exe            windows-11-arm  (NSIS)
#   anymodel-bot-<version>-linux-x86_64.AppImage    ubuntu-24.04    (smoke-tested under Xvfb)
#   anymodel-bot-<version>-linux-arm64.AppImage     ubuntu-24.04-arm (smoke-tested under Xvfb)
#   Each installer is built on a runner of its own OS *and* CPU: dsh-runtime/node_modules is full of
#   per-arch native packages (node-pty, koffi, sharp, ripgrep, ...) and scripts/prepare-dsh.mjs
#   installs and prunes them for exactly one os-cpu. scripts/bundle-dsh.mjs then packs the runtime
#   into resources/dsh: one dsh.asar (all JavaScript, ~10k files) plus a node_modules/ with only the
#   native packages (~55 files), which keeps the Windows installer fast (few files to extract and scan).
#
# Code signing / notarization: repository secrets. A tag (release) build of a macOS installer fails
#   unless it is signed with a Developer ID *and* notarized: after packaging, the app and the app inside
#   the shipped DMG must pass `codesign --verify`, `xcrun stapler validate` and
#   `spctl --assess` with "source=Notarized Developer ID" (electron-builder only logs a warning and
#   carries on when it cannot build notarization options, so the build exit code alone proves nothing).
#   Manual test runs may still go without the secrets: macOS is then ad-hoc signed (Apple Silicon
#   refuses to launch unsigned code) but not notarized, so Gatekeeper asks users to allow it in
#   System Settings > Privacy & Security; Windows is unsigned, so SmartScreen warns.
#     CSC_LINK                     macOS: Developer ID Application certificate, base64 of the .p12
#     CSC_KEY_PASSWORD             macOS: password of that .p12
#     APPLE_ID                     notarization: Apple ID e-mail                 \ used only together
#     APPLE_APP_SPECIFIC_PASSWORD  notarization: app-specific password           | with CSC_LINK;
#     APPLE_TEAM_ID                notarization: 10-character Apple Team ID      / set all three or none
#     WIN_CSC_LINK                 Windows: Authenticode certificate, base64 of the .pfx
#     WIN_CSC_KEY_PASSWORD         Windows: password of that .pfx
#   (e.g. `base64 -i cert.p12 | gh secret set CSC_LINK`). On macOS everything inside the .app is
#   signed with the hardened runtime, including the bundled magpie, cua-driver and dsh native modules.
#   Certificates kept in an HSM / cloud signing service need a custom win.sign setup instead.
#
# Debug packages (developer tools enabled, file names with "-debug-"): only from a manual run with
#   debug_build=true, never on a tag, and every build checks that the packaged package.json carries the
#   flavour it was built as (scripts/check-build-flavor.mjs), so a debug package cannot be released.
#
# electron-updater uses architecture-specific channels (latest-x64 / latest-arm64).
# Build installers, macOS update ZIPs, metadata and blockmaps with --publish never;
# the release job uploads all of them together, after every platform succeeds.
#
# Caches: npm (both lockfiles), Go modules + build cache (vendor/magpie/go.sum), Electron and
# electron-builder downloads. GitHub scopes caches to the ref that created them, and a tag run can
# only read caches from its own tag or the default branch, so a manual run on master warms them
# for the next release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Installers to build: all, or a comma-separated list (mac-arm64,mac-x64,win-x64,win-arm64,linux-x64,linux-arm64)"
        type: string
        default: all
      debug_build:
        description: "Build developer packages (developer tools enabled, '-debug-' in file names). Never allowed on a tag."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  NODE_VERSION: "22"

jobs:
  meta:
    name: Version check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            CHANGELOG.md
            CHANGELOG_en.md
            CHANGELOG_ja.md
            CHANGELOG_ko.md
            CHANGELOG_ru.md
            CHANGELOG_es.md
            CHANGELOG_pt.md
            CHANGELOG_tr.md
            CHANGELOG_zh-TW.md
            ui/locales/manifest.json
            scripts/release-notes.mjs
          sparse-checkout-cone-mode: false

      - name: Read package.json version and match it against the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEBUG_BUILD: ${{ inputs.debug_build && 'true' || 'false' }}
        run: |
          if [ "$REF_TYPE" = tag ] && [ "$DEBUG_BUILD" = true ]; then
            echo "::error::Debug packages cannot be built on a tag: a tag run publishes a GitHub Release"
            exit 1
          fi
          if node -e 'process.exit(require("./package.json").ambDebugBuild === undefined ? 0 : 1)'; then :; else
            echo "::error::package.json must not set ambDebugBuild; debug packages set it only through debug_build"
            exit 1
          fi
          version=$(node -p 'require("./package.json").version')
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match package.json version $version (expected tag v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building anymodel-bot $version"

      - name: This version has a changelog entry
        if: github.ref_type == 'tag'
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > /dev/null

      - name: Select installers
        id: matrix
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          # app: the unpacked app electron-builder leaves next to the installer (checked before upload)
          all='[
            {"name":"mac-arm64","runner":"macos-15","os":"darwin","arch":"arm64","goos":"darwin","goarch":"arm64","targets":"--mac dmg zip","file":"mac-arm64.dmg","app":"release/mac-arm64/anymodel bot.app/Contents/MacOS/anymodel bot"},
            {"name":"mac-x64","runner":"macos-15-intel","os":"darwin","arch":"x64","goos":"darwin","goarch":"amd64","targets":"--mac dmg zip","file":"mac-x64.dmg","app":"release/mac/anymodel bot.app/Contents/MacOS/anymodel bot"},
            {"name":"win-x64","runner":"windows-2025","os":"win32","arch":"x64","goos":"windows","goarch":"amd64","targets":"--win nsis","file":"win-x64.exe","app":"release/win-unpacked/anymodel bot.exe"},
            {"name":"win-arm64","runner":"windows-11-arm","os":"win32","arch":"arm64","goos":"windows","goarch":"arm64","targets":"--win nsis","file":"win-arm64.exe","app":"release/win-arm64-unpacked/anymodel bot.exe"},
            {"name":"linux-x64","runner":"ubuntu-24.04","os":"linux","arch":"x64","goos":"linux","goarch":"amd64","targets":"--linux AppImage","file":"linux-x86_64.AppImage","app":"release/linux-unpacked/anymodel-bot"},
            {"name":"linux-arm64","runner":"ubuntu-24.04-arm","os":"linux","arch":"arm64","goos":"linux","goarch":"arm64","targets":"--linux AppImage","file":"linux-arm64.AppImage","app":"release/linux-arm64-unpacked/anymodel-bot"}
          ]'
          if [ "$TARGETS" = all ]; then
            selected=$(jq -c . <<<"$all")
          else
            selected=$(jq -c --arg t "$TARGETS" '($t | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $want | map(select(.name as $n | $want | index($n)))' <<<"$all")
          fi
          if [ "$(jq length <<<"$selected")" -eq 0 ]; then
            echo "::error::No installer matches targets=$TARGETS"
            exit 1
          fi
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"
          echo "Installers: $(jq -r 'map(.name) | join(", ")' <<<"$selected")"

  build:
    name: ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Chosen by the Version check job: every installer, or the ones a manual run names.
        include: ${{ fromJSON(needs.meta.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
      DEBUG_BUILD: ${{ inputs.debug_build && github.ref_type != 'tag' && '1' || '' }}
      # artifactName in package.json: anymodel-bot-${version}-${os}-${arch}.${ext} (debug: anymodel-bot-${version}-debug-${os}-${arch}.${ext})
      INSTALLER: release/anymodel-bot-${{ needs.meta.outputs.version }}-${{ inputs.debug_build && github.ref_type != 'tag' && 'debug-' || '' }}${{ matrix.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # vendor/deepseek-harness is not needed to package (DSH comes from npm via dsh-runtime/).
      - name: Fetch submodules
        run: git submodule update --init --depth 1 vendor/magpie vendor/kimi-computer-use

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dsh-runtime/package-lock.json

      - name: Check runner platform
        run: |
          host=$(node -p 'process.platform + "-" + process.arch')
          if [ "$host" != "$EXPECTED_PLATFORM" ]; then
            echo "::error::Runner ${{ matrix.runner }} runs Node as $host, expected $EXPECTED_PLATFORM"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: vendor/magpie/go.mod
          cache-dependency-path: vendor/magpie/go.sum

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ matrix.name }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ matrix.name }}-

      - name: Install dependencies
        # electron-builder downloads the Electron build for the target itself; skip the dev copy.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Use bundled Electron checksums
        run: |
          node <<'NODE'
          const fs = require("node:fs"), path = require("node:path"), os = require("node:os");
          const { version } = require("electron/package.json");
          const checksums = require("electron/checksums.json");
          const artifact = `electron-v${version}-${process.platform}-${process.arch}.zip`;
          if (!/^[a-f0-9]{64}$/i.test(checksums[artifact] || "")) throw new Error(`Missing bundled checksum: ${artifact}`);
          const homeDir = os.homedir();
          const cache = process.platform === "darwin" ? path.join(homeDir, "Library", "Caches", "electron")
            : process.platform === "win32" ? path.join(process.env.LOCALAPPDATA || path.join(homeDir, "AppData", "Local"), "electron", "Cache")
            : path.join(process.env.XDG_CACHE_HOME || path.join(homeDir, ".cache"), "electron");
          fs.mkdirSync(cache, { recursive: true });
          fs.writeFileSync(path.join(cache, `SHASUMS256.txt-${version}`), Object.entries(checksums).map(([file, hash]) => `${hash} *${file}`).join("\n") + "\n");
          console.log(`Using bundled SHA256 checksums for ${artifact}`);
          NODE

      - name: Validate all target languages
        run: npm run i18n:check

      - name: Compile TypeScript
        run: npm run build

      - name: Prepare dsh-runtime for ${{ matrix.os }}-${{ matrix.arch }}
        run: node scripts/prepare-dsh.mjs --os "${{ matrix.os }}" --cpu "${{ matrix.arch }}"

      - name: Verify dsh-runtime native modules load on this platform
        run: |
          # shellcheck disable=SC2016 # ${...} below is JavaScript, not shell
          node -e '
            const fs = require("fs"), path = require("path");
            const want = process.env.EXPECTED_PLATFORM;
            const prebuilds = fs.readdirSync("dsh-runtime/node_modules/node-pty/prebuilds");
            if (prebuilds.join() !== want) throw new Error(`node-pty prebuilds are [${prebuilds}], expected [${want}]`);
            const helper = `dsh-runtime/node_modules/node-pty/prebuilds/${want}/spawn-helper`;
            if (fs.existsSync(helper)) fs.accessSync(helper, fs.constants.X_OK);
            const req = require("module").createRequire(path.resolve("dsh-runtime/package.json"));
            for (const m of ["koffi", "sharp", ...(process.platform === "win32" ? [] : ["node-pty"])]) req(m);
            console.log(`dsh-runtime native modules OK for ${want}`);
          '

      - name: Bundle dsh-runtime into dsh.asar + native node_modules
        run: node scripts/bundle-dsh.mjs --os "${{ matrix.os }}" --cpu "${{ matrix.arch }}"

      - name: Build magpie
        run: node scripts/build-magpie.mjs --target "${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Fetch cua-driver
        run: node scripts/fetch-cua-driver.mjs --target "${{ matrix.os }}/${{ matrix.arch }}"

      # Both macOS runner architectures can drop Apple's HTTP/3 connections.
      # https://github.com/actions/runner-images/issues/14924
      - name: Use TCP for Apple services on macOS runners
        if: matrix.os == 'darwin'
        run: |
          printf '%s\n' 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E

      - name: Package ${{ matrix.file }}
        env:
          # Secrets are handed only to the OS that uses them; empty ones are unset below.
          CSC_LINK: ${{ matrix.os == 'darwin' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'darwin' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'darwin' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'darwin' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'darwin' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.os == 'win32' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.os == 'win32' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          # NSIS payload (app-64.7z) at 7z level 3 instead of 9: on windows-2025 with Defender on, the
          # installer grows 156 -> 171 MB and a fresh install drops 35 -> 22 s (extraction 21 -> 11 s).
          # The 7z filter stays BCJ (electron-builder pins it for the NSIS decoder).
          ELECTRON_BUILDER_COMPRESSION_LEVEL: ${{ matrix.os == 'win32' && '3' || '' }}
        run: |
          # Naming the target on the command line overrides the arch lists in package.json "build",
          # so exactly one installer for this runner's arch is produced.
          args=(${{ matrix.targets }} --${{ matrix.arch }} --publish never)
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD ELECTRON_BUILDER_COMPRESSION_LEVEL; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -n "$DEBUG_BUILD" ]; then
            args+=(-c.extraMetadata.ambDebugBuild=true '-c.artifactName=anymodel-bot-${version}-debug-${os}-${arch}.${ext}')
          fi
          # A release must not reach users without a Developer ID signature and notarization.
          if [ "${{ github.ref_type }}" = tag ] && [ "${{ matrix.os }}" = darwin ]; then
            for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!v:-}" ]; then
                echo "::error::$v is not set: a release ${{ matrix.file }} must be signed and notarized"
                exit 1
              fi
            done
          fi
          if [ "${{ matrix.os }}" = darwin ] && [ -z "${CSC_LINK:-}" ]; then
            echo "::warning::CSC_LINK is not set: ${{ matrix.file }} is ad-hoc signed and not notarized"
            # Notarizing an ad-hoc signed app can only fail.
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            args+=(-c.mac.identity=-)
          elif [ "${{ matrix.os }}" = darwin ] && [ -z "${APPLE_ID:-}" ]; then
            echo "::warning::APPLE_ID is not set: ${{ matrix.file }} is signed but not notarized"
          elif [ "${{ matrix.os }}" = win32 ] && [ -z "${WIN_CSC_LINK:-}" ]; then
            echo "::warning::WIN_CSC_LINK is not set: ${{ matrix.file }} is not code-signed"
          fi
          npx electron-builder "${args[@]}"
          if [ ! -f "$INSTALLER" ]; then
            echo "::error::Expected installer $INSTALLER was not produced"
            ls -la release
            exit 1
          fi
          ls -la "$INSTALLER"
          channel="latest-${{ matrix.arch }}"
          case "${{ matrix.os }}" in
            darwin)
              metadata="release/$channel-mac.yml"
              test -s "${INSTALLER%.dmg}.zip"
              ;;
            win32) metadata="release/$channel.yml" ;;
            linux)
              metadata="release/$channel-linux.yml"
              if [ "${{ matrix.arch }}" != x64 ]; then metadata="release/$channel-linux-${{ matrix.arch }}.yml"; fi
              ;;
          esac
          if [ ! -s "$metadata" ]; then
            echo "::error::Missing update metadata: $metadata"
            exit 1
          fi

      # The installer users download: Developer ID signature, stapled notarization ticket and a Gatekeeper
      # verdict of "Notarized Developer ID", for the packaged app and for the app inside the DMG.
      # Required on tags; on manual runs it is checked whenever the app carries a Developer ID signature.
      - name: Verify macOS signature and notarization
        if: matrix.os == 'darwin'
        env:
          APP_EXE: ${{ matrix.app }}
          REQUIRE_NOTARIZED: ${{ github.ref_type == 'tag' && '1' || '' }}
        run: |
          app="${APP_EXE%/Contents/MacOS/*}"
          codesign --verify --deep --strict --verbose=2 "$app"
          if ! codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application'; then
            if [ -n "$REQUIRE_NOTARIZED" ]; then
              echo "::error::$app is not signed with a Developer ID Application certificate"
              exit 1
            fi
            echo "::warning::$app has no Developer ID signature (test build): Gatekeeper will block it"
            exit 0
          fi
          assess() {
            xcrun stapler validate "$1"
            out=$(spctl --assess --type execute --verbose=4 "$1" 2>&1) || { echo "$out"; echo "::error::Gatekeeper rejects $1"; return 1; }
            echo "$out"
            grep -q 'source=Notarized Developer ID' <<<"$out" || { echo "::error::$1 is signed but not notarized"; return 1; }
          }
          assess "$app"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$INSTALLER" > /dev/null
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          inside=$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$inside" ] || { echo "::error::No .app inside $INSTALLER"; exit 1; }
          assess "$inside"

      # Release builds must have developer tools off; debug builds must say so (electron/main.ts reads it).
      - name: Check the build flavour
        run: node scripts/check-build-flavor.mjs "${{ matrix.app }}" "${{ env.DEBUG_BUILD && 'debug' || 'release' }}"

      - name: Check bundled official bots offline
        run: node scripts/verify-builtin-catalog.mjs "${{ matrix.app }}"

      # The packaged executable in Node mode (as the app runs DSH): SDK client and DSH from dsh.asar, native
      # modules from resources/dsh/node_modules, and one agent turn through a mock model.
      - name: Check the packaged DSH runtime
        run: node scripts/verify-dsh-bundle.mjs "${{ matrix.app }}"

      - name: Smoke-test the AppImage
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth fonts-dejavu-core libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libnotify4 libsecret-1-0
          chmod +x "$INSTALLER"
          # Extract instead of mounting: no FUSE on the runner. This is the exact payload users get.
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$INSTALLER" --appimage-extract >/dev/null)
          node scripts/electron-smoke.mjs "$RUNNER_TEMP/squashfs-root/AppRun"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # archive: false uploads the installer itself (artifact name = file name) instead of a zip.
          path: ${{ env.INSTALLER }}
          archive: false
          if-no-files-found: error
          overwrite: true # "Re-run all jobs" uploads the same name again
          retention-days: 14

      - name: Upload update files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-${{ matrix.name }}
          path: |
            release/latest-*.yml
            release/*.blockmap
            release/anymodel-bot-*.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  release:
    name: GitHub Release
    needs: [meta, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            CHANGELOG_en.md
            CHANGELOG_ja.md
            CHANGELOG_ko.md
            CHANGELOG_ru.md
            CHANGELOG_es.md
            CHANGELOG_pt.md
            CHANGELOG_tr.md
            CHANGELOG_zh-TW.md
            ui/locales/manifest.json
            scripts/release-notes.mjs
          sparse-checkout-cone-mode: false

      - name: Write the release notes from the changelog
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: anymodel-bot-${{ needs.meta.outputs.version }}-*
          path: installers
          merge-multiple: true

      - name: Download update files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: updater-*
          path: installers
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: installers
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            # Keep the release invisible to updaters until every referenced asset has uploaded.
            gh release create "$TAG" ./* --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
            gh release edit "$TAG" --draft=false
          fi
