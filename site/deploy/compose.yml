# 在本机部署官网：
#   cp deploy/.env.example deploy/.env  # 填部署值
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
# 然后把 deploy/anymodelbot.Caddyfile.example 按域名改好放进 /etc/caddy/sites.d/ 并 reload Caddy。
name: anymodelbot-site
services:
  builder:
    build: ..
    restart: unless-stopped
    environment:
      SITE_BUILD: ${SITE_BUILD:-production}
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      GITHUB_URL: ${GITHUB_URL:-}
      SECURITY_EMAIL: ${SECURITY_EMAIL:-}
      ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL:-}
      ANALYTICS_SITE_ID: ${ANALYTICS_SITE_ID:-}
      DOCKER_IMAGE: ${DOCKER_IMAGE:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TZ: Asia/Shanghai
    volumes:
      - site:/srv/site
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [builder]
    ports:
      - "127.0.0.1:${SITE_PORT:-18490}:8080"
    volumes:
      - site:/srv/site:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  site:
